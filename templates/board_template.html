<!DOCTYPE html>
<html lang='zh'>
<head><meta charset='UTF-8'><title>妖板交易系统 · 操盘看板</title><style>
body{font-family:'Microsoft YaHei',sans-serif;background:#0e1520;color:#d7e0ea;margin:0;padding:16px}
.card{background:#151f2e;border:1px solid #243447;border-radius:8px;padding:14px 16px;margin-bottom:12px}
h1{font-size:18px;color:#fff;margin:0 0 4px}h2{font-size:14px;color:#8fb4d9;margin:0 0 10px}
.top3{display:flex;gap:12px}.top3 .card{flex:1;text-align:center}
.big{font-size:26px;font-weight:bold}.up{color:#f0485c}.down{color:#25c26e}
table{width:100%;border-collapse:collapse;font-size:13px}
th{background:#1c2a3d;color:#9db8d4;padding:6px 8px;text-align:left;border-bottom:1px solid #243447}
td{padding:6px 8px;border-bottom:1px solid #1c2a3d}
.tag{display:inline-block;padding:1px 8px;border-radius:10px;font-size:11px}
.tag.buy{background:#2a4a35;color:#6fe3a0}.tag.sell{background:#4a2a2e;color:#f48a9a}
.tag.t{background:#3a3550;color:#b9a7f5}
svg text{font-size:10px;fill:#9db8d4}.legend{font-size:12px;color:#9db8d4;margin:6px 0}
.stamp{font-size:11px;color:#5c7291;margin-top:8px}
</style></head><body>
<h1>妖板交易系统 · 操盘看板</h1>
<div class='stamp' id='stamp'></div>
<div class='top3'>
<div class='card'><div>总资产</div><div class='big' id='total'>—</div><div id='total_sub' style='font-size:12px;color:#9db8d4'></div></div>
<div class='card'><div>持仓市值</div><div class='big' id='mv'>—</div><div id='pos_count' style='font-size:12px;color:#9db8d4'></div></div>
<div class='card'><div>可用资金</div><div class='big' id='cash'>—</div><div id='cash_sub' style='font-size:12px;color:#9db8d4'></div></div>
</div>
<div class='card'><h2>组合曲线</h2><svg id='curve' width='100%' height='220'></svg><div class='legend'>红=组合收益 · 蓝=沪深300</div></div>
<div class='card'><h2>组合进度（vs 选手 6.4×）</h2>
<div id='prog_bar' style='background:#1c2a3d;border-radius:6px;height:22px;position:relative'>
<div id='prog_fill' style='background:#f0485c;height:100%;border-radius:6px;width:0%'></div>
</div><div id='prog_text' class='legend'></div></div>
<div class='card'><h2>持仓明细</h2><table id='pos_table'><thead><tr><th>股票</th><th>持仓</th><th>成本价</th><th>现价</th><th>市值</th><th>浮动盈亏</th><th>盈亏比例</th><th>止损价</th><th>操作时间</th><th>持有天数</th></tr></thead><tbody></tbody></table></div>
<div class='card'><h2>盘中实况（最新扫描）</h2>
<div id='live_scan' class='legend'></div>
<div id='live_momentum' class='legend'></div>
<div id='live_pos' class='legend'></div></div>
<div class='card'><h2>交易记录</h2><table id='fills_table'><thead><tr><th>时间</th><th>股票</th><th>方向</th><th>数量</th><th>价格</th><th>说明</th></tr></thead><tbody></tbody></table></div>
<div class='card'><h2>盈亏分析</h2><div id='pnl_summary' class='legend'></div><table id='pnl_table'><thead><tr><th>股票</th><th>盈亏金额</th><th>盈亏比例</th><th>贡献度</th></tr></thead><tbody></tbody></table></div>
<div class='card'><h2>交易员自省</h2>
<div id='sc_summary' class='legend'></div>
<table id='sc_table'><thead><tr><th>买点类型</th><th>次数</th><th>卖出触发</th><th>次数</th></tr></thead><tbody></tbody></table>
<div id='sc_audit' class='legend'></div></div>
<div class='card'><h2>做T点位分布</h2><div id='t_charts'></div></div>
<script>
var B = __BOARD_JSON__;
function pct(x){return (x>0?'+':'')+Number(x).toFixed(2)+'%'}
function fmt(x){return x==null?'—':Number(x).toLocaleString('zh-CN',{maximumFractionDigits:2})}
function cls(x){return x>0?'up':(x<0?'down':'')}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function render(){
  // 时间戳
  var st='数据日期 '+esc(B.date)+(B.build_time?' · 生成 '+esc(B.build_time):'');
  if(B.live&&B.live.scan&&B.live.scan.time)st+=' · 最近扫描 '+esc(B.live.scan.time);
  document.getElementById('stamp').textContent=st+' · 每30秒自动刷新';
  // top3
  document.getElementById('total').textContent='¥'+fmt(B.total_asset);
  document.getElementById('total_sub').textContent=B.day_pnl!=null?('当日 '+cls(B.day_pnl)+' '+pct(B.day_pnl)):'—';
  document.getElementById('mv').textContent='¥'+fmt(B.mv);
  var pc=B.positions?B.positions.length:0;
  document.getElementById('pos_count').textContent=pc+' 只持仓';
  document.getElementById('cash').textContent='¥'+fmt(B.cash);
  document.getElementById('cash_sub').textContent='起始 '+fmt(B.start_cash);
  // 曲线
  var svg=document.getElementById('curve');svg.innerHTML='';
  var cv=(B.curve||[]).filter(function(c){return c.equity!=null});
  if(cv.length>1){
    var W=svg.clientWidth||900,H=210,pad=8;
    var mx=Math.max.apply(null,cv.map(function(c){return c.equity}));
    var mn=Math.min.apply(null,cv.map(function(c){return c.equity}));
    var rg=(mx-mn)||1;
    function P(c,i){return (i/(cv.length-1))*W+' '+(H-pad-((c.equity-mn)/rg)*(H-2*pad))}
    var d=cv.map(P).join(' ');
    svg.innerHTML='<polyline points="'+d+'" fill="none" stroke="#f0485c" stroke-width="1.5"/>'+
      cv.filter(function(c){return c.bench!=null}).map(function(c,i){return '<circle cx="'+(i/(cv.length-1))*W+'" cy="'+(H-pad-((c.equity-mn)/rg)*(H-2*pad))+'" r="1.5" fill="#8fb4d9"/>'}).join('');
    svg.innerHTML+='<text x="4" y="12" fill="#9db8d4">'+fmt(mn)+' ~ '+fmt(mx)+'</text>';
  } else { svg.innerHTML='<text x="10" y="20" fill="#5c7291">曲线数据不足</text>'; }
  // 进度
  var pr=B.progress||{};
  if(pr.pct!=null){document.getElementById('prog_fill').style.width=Math.min(pr.pct,100)+'%';}
  document.getElementById('prog_text').textContent=(pr.multiple!=null?('组合 '+pr.multiple+'× / 选手 '+pr.player_mult+'× · 达成 '+pr.pct+'%'):'—')+(pr.mdd!=null?' · 最大回撤 '+pr.mdd+'%':'');
  // 持仓明细
  var pt=document.querySelector('#pos_table tbody');pt.innerHTML='';
  (B.positions||[]).forEach(function(p){
    var tr=document.createElement('tr');
    tr.innerHTML='<td>'+esc(p.sym)+' '+esc(p.name)+'</td><td>'+fmt(p.qty)+'</td><td>'+fmt(p.cost)+'</td><td>'+fmt(p.last)+'</td><td>'+fmt(p.mv)+'</td><td class="'+cls(p.pnl)+'">'+fmt(p.pnl)+'</td><td class="'+cls(p.pnl_pct)+'">'+(p.pnl_pct!=null?pct(p.pnl_pct):'—')+'</td><td>'+fmt(p.stop_px)+'</td><td>'+esc(p.entry_ts||'—')+'</td><td>'+p.days+'</td>';
    pt.appendChild(tr);
  });
  // 实况
  var lv=B.live||{},scn=lv.scan||{};
  var rows=(scn.rows||[]).slice(0,8);
  document.getElementById('live_scan').textContent='异动Top('+(scn.time||'')+'): '+(rows.length?rows.map(function(r){return r.name+' '+(r.chg>0?'+':'')+r.chg.toFixed(1)+'%'}).join(' · '):'盘中扫描未启动');
  var mom=lv.momentum||{};
  var secs=(mom.sectors||[]).slice(0,5);
  document.getElementById('live_momentum').textContent='板块轮动: '+(secs.length?secs.map(function(s){return s.l2+' '+s.avg_chg+'%'}).join(' · '):'—');
  var pl=lv.pos_live||{};
  document.getElementById('live_pos').textContent='持仓实时: '+(pl.positions&&pl.positions.length?pl.positions.map(function(q){return q.sym+' '+(q.px!=null?q.px+'('+(q.chg>0?'+':'')+q.chg.toFixed(1)+'%)':'T+1锁定')}).join(' · '):'盘中未更新');
  // 交易记录
  var ft=document.querySelector('#fills_table tbody');ft.innerHTML='';
  var fills=(B.fills_today||[]).slice(-30).reverse();
  if(!fills.length&&B.fills_all){fills=B.fills_all.slice(-30).reverse();}
  fills.forEach(function(f){
    var tr=document.createElement('tr');
    var tag=f.side==='buy'?'<span class="tag buy">买</span>':(f.side==='sell'?'<span class="tag sell">卖</span>':'<span class="tag t">T</span>');
    tr.innerHTML='<td>'+esc(f.ts||f.date||'')+'</td><td>'+esc(f.sym)+'</td><td>'+tag+'</td><td>'+fmt(f.qty)+'</td><td>'+fmt(f.px)+'</td><td>'+esc(f.reason||f.kind||'')+'</td>';
    ft.appendChild(tr);
  });
  // 盈亏分析
  document.getElementById('pnl_summary').textContent=B.pnl_summary||'—';
  var nt=document.querySelector('#pnl_table tbody');nt.innerHTML='';
  (B.pnl_detail||[]).forEach(function(p){
    var tr=document.createElement('tr');
    tr.innerHTML='<td>'+esc(p.sym)+' '+esc(p.name)+'</td><td class="'+cls(p.pnl)+'">'+fmt(p.pnl)+'</td><td class="'+cls(p.pnl_pct)+'">'+(p.pnl_pct!=null?pct(p.pnl_pct):'—')+'</td><td>'+(p.share!=null?p.share+'%':'—')+'</td>';
    nt.appendChild(tr);
  });
  // 自省
  var sc=B.selfcheck||{};
  document.getElementById('sc_summary').textContent='当日 '+(sc.day_pnl!=null?pct(sc.day_pnl):'—')+' · 成交 '+sc.fills+' 笔 · 累计交易 '+sc.trades_total+' 笔'+(sc.win_rate!=null?' · 胜率 '+sc.win_rate+'%':'')+(sc.t_rounds?' · 做T '+sc.t_rounds+' 次':'');
  var scb=Object.entries(sc.buy_kinds||{}),scr=Object.entries(sc.sell_reasons||{});
  var sct=document.querySelector('#sc_table tbody');sct.innerHTML='';
  var nrow=Math.max(scb.length,scr.length);
  for(var i=0;i<nrow;i++){var tr=document.createElement('tr');var b=scb[i]||['—',''];var s=scr[i]||['—',''];tr.innerHTML='<td>'+esc(b[0])+'</td><td>'+(b[1]??'')+'</td><td>'+esc(s[0])+'</td><td>'+(s[1]??'')+'</td>';sct.appendChild(tr);}
  var sca=(sc.audit||[]).map(function(a){return a.sym+' '+a.verdict+'('+a.note+')'}).join('；');
  document.getElementById('sc_audit').textContent=sca?('符合度: '+sca):'符合度: 当日无买入';
  // 做T
  var tc=document.getElementById('t_charts');tc.innerHTML='';
  var tcdata=B.t_charts||[];
  if(tcdata.length){tc.innerHTML=tcdata.map(function(t){return '<div class="legend">'+esc(t.sym)+' · '+esc(t.detail||'')+'</div>'}).join('');}
  else{tc.innerHTML='<div class="legend">无做T点位</div>';}
}
render();
setInterval(function(){
  fetch('./board.json',{cache:'no-store'}).then(function(r){return r.json()}).then(function(d){B=d;render()}).catch(function(){});
},30000);
</script>
</body></html>
