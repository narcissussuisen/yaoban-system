why_hard = "⭐ 唯一有**完整执行率证据**的入场判据（9/9、9/10 两日一票否决规则执行率 100%）；但「有量」「一步步向上」的阈值未给 → 这是最该由 LLM 承担的一项"
budget = "候选级（≤50 只/日）；同标的同状态 5 分钟内复用缓存"
