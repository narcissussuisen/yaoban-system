outputs = ["A_optimum（有量 + 一步一步向上）", "B_medium（无量、欠缺力度 → 可观察不优先）", "C_reject（第一波回落跌破均价线 → 弃）"]
sop_quote = "① 最优：分时有量 + 一步一步向上走 ② 中等：无量、欠缺力度 ③ 弃：第一波回落跌破均价线；「金能科技刚发出来它分时就是跌破均价线的，这种是不玩的啊，纪律说过很多次的！」"
