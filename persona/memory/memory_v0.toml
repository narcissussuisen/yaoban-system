title = "净值与胜率声明不可作真值（只有离散决策可核验）"
content = "可解析净值点仅 **28 天（38.4%）**；7 月 **44 天断裂**；本金口径在 3W/5W 间摇摆；天数出现倒退；「6 月胜率 91%」**只出现在视频标题、正文未复述**。另：04-17 口述「本金 3W」而 `PLAYER_EVIDENCE_FULL` 记 04-17 总资产 **44,384**（非 3W）。"
lesson = "**可核验的只有：离散决策标签（候选/执行/持仓截图）+ 单笔盈亏 + K 线**。连续净值轨只能标为**弱证据**，不得用于计算其收益率或作为复利基准。"
applies_to = []
evidence = "E5"
source = "画像 §4.4 硬约束 3 + `PLAYER_EVIDENCE_FULL.md`"
