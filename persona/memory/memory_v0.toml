[[entry]]
id = "MEM-207"
date = "2026-09-11"
kind = "meta_lesson"
title = "命中的是「行为」不等于有「超额收益」——已证伪项清单"
content = "「分时跌破均价线 → 不玩」命中选手行为 **94.4%**，但全市场反事实**显著负 alpha**（被否决组前向 5 日均值 0.872% vs 通过组 0.366%，Welch p=0.0013，单调反向）→ 判为**行为特征/心理偏好**。「涨停回踩低吸」独立运行影子盘 **−33.7%**（113 笔）；同期「上升回档低吸」+22.4%。"
lesson = "⭐⭐ **架构级分离：行为复刻 ≠ 收益来源**。凡「命中率高」的规则，仍须过「反事实方向 + 统计显著」双门槛才能作为收益过滤器；否则**只保留为行为复刻/诊断项**。"
applies_to = ["GEN-ENTRY-04", "P4-NOTE-01"]
evidence = "E6"
source = "docs/ITERATION_2026-09-11.md + 画像 §4"
tags = ["证据纪律", "证伪", "架构分离"]

