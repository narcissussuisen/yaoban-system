[[entry]]
id = "MEM-204"
date = "2026-09-08"
kind = "meta_lesson"
title = "「吃板」有两层含义，不可当成交记录"
content = "第一层：**盘中触及涨停价**即可称吃板（杭电股份 9/8 最高精确 +10.01%、收盘回落至 +8.52%，仍称「吃板啦」）。第二层：**「吃板」= 战法筛选命中，不等于个人持仓** —— 9/8 播报「一天收获 3 只板」，实际只持有 2 只（集泰、杭电），泸天化表述为「用战法**筛选**出来」。"
lesson = "核对播报须**双层拆解**：① 战法是否命中（命中率高，可逐条 K 线核验）② 是否转化为持仓（**≠100%**）。"
applies_to = ["GEN-DRAGON-06"]
evidence = "E2"
source = "2026-09-08 吃板播报 + 持仓截图"
tags = ["证据纪律", "口径陷阱"]

